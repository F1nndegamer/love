<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d1822" />
    <title>23.09 — Together</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap");

      :root {
        --ink: #f7efe9;
        --muted: #b8a9aa;
        --wine: #1d1822;
        --plum: #2a1e2f;
        --coral: #ed846d;
        --peach: #ffb38c;
        --line: rgba(255, 238, 232, 0.14);
        --mono: "DM Mono", monospace;
        --sans: "Manrope", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--ink);
        background: var(--wine);
        font-family: var(--sans);
      }

      .page {
        width: min(1120px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 34px 0 40px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
      }

      .mark i {
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 50%;
        background: var(--coral);
        box-shadow: 0 0 18px var(--coral);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(260px, 0.7fr) minmax(0, 1.3fr);
        align-items: center;
        flex: 1;
        gap: clamp(40px, 6vw, 88px);
        padding: 8vh 0 5vh;
      }

      .intro {
        max-width: 360px;
      }

      .eyebrow {
        margin: 0 0 24px;
        color: var(--peach);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 390px;
        margin: 0;
        font-size: clamp(4rem, 9vw, 8.4rem);
        font-weight: 700;
        letter-spacing: -0.09em;
        line-height: 0.82;
      }

      h1 span {
        display: block;
        color: var(--coral);
      }

      .intro p {
        max-width: 270px;
        margin: 33px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }

      .timer-shell {
        position: relative;
        width: 100%;
        min-width: 0;
        padding: clamp(22px, 4vw, 46px);
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--plum);
      }

      .timer-label {
        margin: 0 0 27px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .timer {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
      }

      .unit {
        position: relative;
        min-width: 0;
        padding: 0 clamp(12px, 2.5vw, 28px);
      }

      .unit:first-child {
        padding-left: 0;
      }

      .unit + .unit {
        border-left: 1px solid var(--line);
      }

      .number {
        display: block;
        color: var(--ink);
        font-size: clamp(2.4rem, 6vw, 5.5rem);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: -0.08em;
        line-height: 0.95;
      }

      .unit-label {
        display: block;
        margin-top: 17px;
        color: var(--coral);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .since {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 20px;
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        line-height: 1.6;
        text-transform: uppercase;
      }

      .since strong {
        color: var(--ink);
        font-weight: 500;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pulse {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--coral);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      @media (max-width: 900px) {
        .hero {
          grid-template-columns: 1fr;
          gap: 56px;
          padding: 11vh 0 8vh;
        }

        .intro {
          max-width: none;
        }

        .intro p {
          margin-top: 24px;
        }
      }

      @media (max-width: 520px) {
        .page {
          width: min(100% - 32px, 1120px);
          padding-top: 24px;
        }

        .topbar span:last-child {
          display: none;
        }

        .timer-shell {
          padding: 24px 18px;
        }

        .number {
          font-size: clamp(1.8rem, 10vw, 3.4rem);
        }

        .unit {
          padding: 0 9px;
        }

        .unit-label {
          font-size: 8px;
        }

        .since {
          align-items: start;
          flex-direction: column;
          gap: 8px;
          margin-top: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <nav class="topbar" aria-label="Page header">
        <span class="mark"><i aria-hidden="true"></i> 23.09 / together</span>
        <span>just us / 01</span>
      </nav>

      <section class="hero">
        <div class="intro">
          <p class="eyebrow">Our time</p>
          <h1>Time<br /><span>together.</span></h1>
          <p>Every second with you, counted.</p>
        </div>

        <section class="timer-shell" aria-labelledby="timer-heading">
          <h2 id="timer-heading" class="timer-label">Elapsed since 23 September 2026</h2>
          <div class="timer" aria-live="polite">
            <div class="unit">
              <span class="number" id="years">00</span>
              <span class="unit-label">Years</span>
            </div>
            <div class="unit">
              <span class="number" id="days">00</span>
              <span class="unit-label">Days</span>
            </div>
            <div class="unit">
              <span class="number" id="hours">00</span>
              <span class="unit-label">Hours</span>
            </div>
            <div class="unit">
              <span class="number" id="minutes">00</span>
              <span class="unit-label">Minutes</span>
            </div>
            <div class="unit">
              <span class="number" id="seconds">00</span>
              <span class="unit-label">Seconds</span>
            </div>
          </div>
          <div class="since">
            <span>Started at <strong>23.09.2026 · 22:35</strong></span>
          </div>
        </section>
      </section>

      <footer class="footer">
        <span><i class="pulse" aria-hidden="true"></i>Live / updating now</span>
        <span>always us</span>
      </footer>
    </main>

    <script>
      const startDate = new Date("2026-09-23T22:35:00");
      const elements = {
        years: document.querySelector("#years"),
        days: document.querySelector("#days"),
        hours: document.querySelector("#hours"),
        minutes: document.querySelector("#minutes"),
        seconds: document.querySelector("#seconds"),
      };

      const pad = (value) => String(value).padStart(2, "0");

      function updateTimer() {
        const now = new Date();
        let remaining = Math.max(0, now.getTime() - startDate.getTime());
        const minute = 60 * 1000;
        const hour = 60 * minute;
        const day = 24 * hour;
        const year = 365.2425 * day;
        const years = Math.floor(remaining / year);
        remaining -= years * year;
        const days = Math.floor(remaining / day);
        remaining -= days * day;
        const hours = Math.floor(remaining / hour);
        remaining -= hours * hour;
        const minutes = Math.floor(remaining / minute);
        const seconds = Math.floor((remaining % minute) / 1000);

        elements.years.textContent = pad(years);
        elements.days.textContent = pad(days);
        elements.hours.textContent = pad(hours);
        elements.minutes.textContent = pad(minutes);
        elements.seconds.textContent = pad(seconds);
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    </script>
  </body>
</html>
